
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    
</head>

<body>
    
    <div class="container mt-3">

        <h1>Students</h1>

        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Student Name</th>
                    <th>Student Age</th>
                    <th>Student Contact</th>
                    <th>Student Course</th>
                </tr>
            </thead>

            <tbody id="stdTable">
            </tbody>
        </table>

    </div>

    <script>

        fetch("https://localhost:7260/api/Student")

            .then((response) => {
                if (!response.ok) {
                    throw new Error("API Error: " + response.status);
                }

                return response.json();
            })

            .then((data) => {

               

                for (let std of data) {
                    document.getElementById("stdTable").innerHTML +=
                    `
                        <tr>
                            <th>${std.studentId ?? std.StudentId}</th>
                            <td>${std.studentName ?? std.StudentName}</td>
                            <td>${std.studentAge ?? std.StudentAge}</td>
                            <td>${std.studentContact ?? std.StudentContact}</td>
                            <td>${std.studentCourse ?? std.StudentCourse}</td>
                        </tr>
                    `;
                }

                

            })

            .catch((err) => {
                console.log("Error:", err);
            });




    </script>

</body>
</html>
